name: Gateway checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gateway-test-only
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: gateway_test
      PGPASSWORD: gateway-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - name: Check database migration and invariants
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role;'
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          for checks in tests/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$checks"
          done
      - name: Check student flows in Chromium
        env:
          BROWSER_CHANNEL: chromium
        run: |
          npx playwright install --with-deps chromium
          node server.mjs > /tmp/gateway-demo.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/readyz; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:browser:live
